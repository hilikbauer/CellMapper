name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash setup.sh
      - name: Set tile user agent
        run: |
          sed -i 's|userAgentValue = packageName|userAgentValue = "CellMapper/1.0 (https://github.com/hilikbauer/CellMapper)"|' app/src/main/java/com/example/cellmapper/MainActivity.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CellMapper-apk
          path: app/build/outputs/apk/debug/app-debug.apk
